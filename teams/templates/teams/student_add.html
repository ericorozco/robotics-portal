{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link rel="stylesheet" href="{% static 'teams/style.css' %}">
</head>

<body>

<div class="container">

    <h1>Add Student</h1>

    <p>
        <strong>Team:</strong>
        {{ team.team_number }} - {{ team.team_name }}
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Add Student
        </button>

        <a class="button"
           href="{% url 'team_detail' team.id %}">
            Cancel
        </a>
    </form>

</div>

</body>
</html>
